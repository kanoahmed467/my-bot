<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>استوديو الكتّاب | Speed Manga</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#07090e;--card:#11151f;--field:#181e2c;--primary:#3b82f6;
    --emerald:#10b981;--muted:#8b95a7;--err:#f87171;--ok:#4ade80;--border:rgba(255,255,255,.07)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:#fff;font-family:'Tajawal',sans-serif;
    background-image:radial-gradient(circle at 50% 0%,rgba(59,130,246,.12),transparent 60%);
    padding:16px 16px calc(36px + env(safe-area-inset-bottom));min-height:100vh
  }
  .top-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .top-head h1{font-size:21px;font-weight:900;margin:0;display:flex;align-items:center;gap:8px}
  .badge-status{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:#cbd5e1}
  .badge-status.trusted{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:#34d399}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;background:var(--card);padding:6px;border-radius:16px;border:1px solid var(--border)}
  .tabs button{padding:10px 6px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
  .tabs button.on{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;box-shadow:0 4px 15px rgba(59,130,246,.3)}
  .tabs button:disabled{opacity:.35;pointer-events:none}

  .card-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .sec-title{font-size:15px;font-weight:900;color:#60a5fa;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  label{display:block;margin:14px 0 6px;font-weight:700;font-size:13px;color:#e2e8f0}
  label span.opt{font-size:11px;color:var(--muted);font-weight:500}
  input[type=text],input[type=number],textarea,select{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--field);color:#fff;font:inherit;font-size:14px;transition:.2s;outline:none
  }
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  textarea{min-height:100px;resize:vertical}
  #content{min-height:290px;line-height:2;font-size:15px}

  .dual-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.dual-grid{grid-template-columns:1fr}}

  .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
  .good{color:var(--ok);font-weight:700} .bad{color:var(--err);font-weight:700}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:7px 13px;border-radius:999px;background:var(--field);color:#cbd5e1;font-size:12px;font-weight:700;border:1px solid var(--border);cursor:pointer;transition:.15s}
  .chip.on{background:rgba(59,130,246,.2);color:#60a5fa;border-color:#3b82f6}

  .custom-genre-row{display:flex;gap:8px;margin-top:10px}
  .custom-genre-row input{flex:1;padding:9px 12px;font-size:13px}
  .custom-genre-row button{padding:0 16px;border:0;border-radius:10px;background:#1e293b;color:#60a5fa;font:inherit;font-size:12px;font-weight:800;border:1px solid rgba(59,130,246,.3);cursor:pointer;white-space:nowrap}

  #cover-row{display:flex;gap:14px;align-items:center;background:var(--field);padding:12px;border-radius:14px;border:1px dashed rgba(255,255,255,.15)}
  #cover-preview{width:82px;height:116px;border-radius:10px;background:#0d1017 center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;border:1px solid var(--border)}
  .file-btn{display:inline-block;padding:8px 14px;background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.35);border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:6px}

  .toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tool-btn{padding:6px 11px;border-radius:8px;background:var(--field);border:1px solid var(--border);color:#cbd5e1;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
  .tool-btn:active{transform:scale(.95)}

  #banner{display:none;margin:0 0 14px;padding:12px 14px;border-radius:12px;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--err);font-size:13px;font-weight:700}
  #submit{
    width:100%;margin-top:10px;padding:15px;border:0;border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font:inherit;font-weight:900;font-size:16px;
    box-shadow:0 8px 25px rgba(37,99,235,.35);cursor:pointer;transition:.2s
  }
  #submit:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
  .hidden{display:none!important}
</style>
</head>
<body>

<div class="top-head">
  <h1><i class="fa-solid fa-feather-pointed" style="color:#3b82f6"></i> استوديو المؤلفين</h1>
  <span id="trust-badge" class="badge-status hidden"></span>
</div>

<div id="banner"></div>

<div class="tabs">
  <button id="tab-novel" class="on" type="button"><i class="fa-solid fa-book"></i> رواية جديدة</button>
  <button id="tab-chapter" type="button" disabled><i class="fa-solid fa-file-circle-plus"></i> فصل جديد</button>
  <button id="tab-edit" type="button" disabled><i class="fa-solid fa-pen-to-square"></i> تعديل روايتي</button>
</div>

<!-- اختيار الرواية (يظهر في وضع فصل جديد أو تعديل روايتي) -->
<div id="select-novel-box" class="card-box hidden">
  <div class="sec-title"><i class="fa-solid fa-bookmark"></i> اختر روايتك</div>
  <select id="novel-id"></select>
</div>

<!-- بيانات الرواية (تظهر في وضع رواية جديدة أو تعديل روايتي) -->
<div id="novel-part" class="card-box">
  <div class="sec-title"><i class="fa-solid fa-sparkles"></i> تفاصيل الرواية الأساسية</div>
  <p style="font-size:12px;color:var(--muted);margin:0 0 10px">💡 يمكنك كتابة الاسم بالعربي فقط أو بالإنجليزي فقط أو الاثنين معاً (واحد منهما على الأقل).</p>

  <div class="dual-grid">
    <div>
      <label>الاسم بالعربي <span class="opt">(اختياري)</span></label>
      <input id="title-ar" type="text" maxlength="100" placeholder="مثال: سولو ليفلينج" autocomplete="off">
    </div>
    <div>
      <label>الاسم بالإنجليزي <span class="opt">(اختياري)</span></label>
      <input id="title-en" type="text" maxlength="100" placeholder="e.g. Solo Leveling" dir="ltr" autocomplete="off">
    </div>
  </div>

  <div id="status-edit-wrap" class="hidden">
    <label>حالة الرواية</label>
    <select id="novel-status">
      <option value="مستمر">🟢 مستمرة</option>
      <option value="مكتمل">🏁 مكتملة</option>
      <option value="متوقف">⏸️ متوقفة مؤقتاً</option>
    </select>
  </div>

  <label>غلاف الرواية <span id="cover-opt-lbl" class="opt"></span></label>
  <div id="cover-row">
    <div id="cover-preview"><i class="fa-regular fa-image"></i></div>
    <div style="flex:1">
      <label for="cover" class="file-btn"><i class="fa-solid fa-cloud-arrow-up"></i> اختر صورة الغلاف</label>
      <input id="cover" type="file" accept="image/jpeg,image/png,image/webp" style="display:none">
      <div class="meta"><span id="cover-msg">JPG / PNG / WEBP — حتى 3MB</span></div>
    </div>
  </div>

  <label>التصنيفات <span class="opt">(اختر حتى 5 تصنيفات أو أضف تصنيفاً خاصاً)</span></label>
  <div id="genres" class="chips"></div>
  <div class="custom-genre-row">
    <input id="custom-genre-inp" type="text" maxlength="25" placeholder="تصنيف غير موجود؟ اكتبه هنا...">
    <button type="button" id="add-genre-btn">+ إضافة</button>
  </div>

  <label>قصة الرواية (الملخص)</label>
  <textarea id="synopsis" placeholder="اكتب نبذة مشوقة عن عالم الرواية وأحداثها بدون حرق..."></textarea>
  <div class="meta"><span>الحد الأدنى 50 حرف</span><span id="synopsis-msg">0 / 50</span></div>
</div>

<!-- قسم كتابة الفصل (يظهر في رواية جديدة أو فصل جديد) -->
<div id="chapter-editor-part" class="card-box">
  <div class="sec-title"><i class="fa-solid fa-pen-Fancy"></i> محرر الفصل</div>

  <div class="dual-grid">
    <div id="chap-num-wrap" class="hidden">
      <label>رقم الفصل <span class="opt">(اتركه فارغاً للترقيم التلقائي)</span></label>
      <input id="chapter-num" type="text" inputmode="decimal" placeholder="تلقائي (مثال: 2)" autocomplete="off">
    </div>
    <div style="grid-column: span 2" id="chap-title-col">
      <label id="ch-label">عنوان الفصل الأول</label>
      <input id="chapter-title" type="text" maxlength="100" placeholder="مثال: البداية في الزنزانة المظلمة" autocomplete="off">
    </div>
  </div>

  <label>محتوى الفصل</label>
  <div class="toolbar">
    <button type="button" class="tool-btn" onclick="insertSep('══════════════════')"><i class="fa-solid fa-minus"></i> فاصل مشهد</button>
    <button type="button" class="tool-btn" onclick="insertSep('***')"><i class="fa-solid fa-asterisk"></i> نجوم</button>
    <button type="button" class="tool-btn" onclick="formatParagraphs()"><i class="fa-solid fa-wand-magic-sparkles"></i> تنسيق الفقرات تلقائياً</button>
    <button type="button" class="tool-btn" onclick="clearDraft()" style="margin-right:auto;color:#f87171"><i class="fa-solid fa-trash"></i> مسح المسودة</button>
  </div>
  <textarea id="content" placeholder="ابدأ بكتابة أحداث الفصل هنا... (يتم حفظ مسودتك تلقائياً أثناء الكتابة)"></textarea>
  <div class="meta">
    <span id="words-msg">0 كلمة | 💾 محفوظ تلقائياً</span>
    <span id="content-msg">0 / 500 حرف</span>
  </div>
</div>

<button id="submit" type="button" disabled>إرسال للمراجعة</button>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
try { tg.BackButton.show(); tg.BackButton.onClick(() => history.back()); } catch (e) {}

const API = "https://apispeedmanga.hidenplay.net";
const RULES = {
  titleMin: 2, synopsisMin: 50, contentMin: 500,
  coverMax: 3 * 1024 * 1024,
  coverTypes: ["image/jpeg", "image/png", "image/webp"],
  maxGenres: 5
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const headers = () => ({ "X-Telegram-Init-Data": tg.initData || "" });

let mode = "novel", coverFile = null, slotsLeft = null, busy = false, isTrusted = false;
let picked = new Set(), allGenresList = [], myNovelsList = [];

function getCombinedTitle() {
  const ar = $("title-ar").value.trim();
  const en = $("title-en").value.trim();
  return ar || en;
}

function validate() {
  const e = {};
  if (mode === "novel" || mode === "edit") {
    if (getCombinedTitle().length < RULES.titleMin) e.title = 1;
    if (mode === "novel" && !coverFile) e.cover = 1;
    if (!picked.size) e.genre = 1;
    if ($("synopsis").value.trim().length < RULES.synopsisMin) e.synopsis = 1;
  }
  if (mode === "novel" || mode === "chapter") {
    const cLen = $("content").value.trim().length;
    if (!$("chapter-title").value.trim()) e.chTitle = 1;
    if (cLen < RULES.contentMin) e.content = 1;
  }
  if ((mode === "chapter" || mode === "edit") && !$("novel-id").value) e.novel = 1;
  if (mode !== "edit" && slotsLeft === 0 && !isTrusted) e.limit = 1;
  return e;
}

function render() {
  const e = validate();
  const cText = $("content").value.trim();
  const cLen = cText.length;
  const words = cText ? cText.split(/\s+/).length : 0;
  const sLen = $("synopsis").value.trim().length;

  $("content-msg").textContent = `${cLen} / ${RULES.contentMin} حرف`;
  $("content-msg").className = e.content ? "bad" : "good";
  $("words-msg").textContent = `📊 ${words} كلمة | 💾 محفوظ تلقائياً`;
  $("synopsis-msg").textContent = `${sLen} / ${RULES.synopsisMin}`;
  $("synopsis-msg").className = e.synopsis ? "bad" : "good";

  $("banner").style.display = e.limit ? "block" : "none";
  $("banner").textContent = "⏳ لديك طلبات قيد المراجعة حالياً. انتظر مراجعة الإدارة أو احصل على رتبة (كاتب موثوق) للنشر الفوري.";

  if (!busy) {
    if (mode === "edit") $("submit").textContent = "💾 حفظ تعديلات الرواية";
    else $("submit").textContent = isTrusted ? "🚀 نشر فوري الآن (كاتب موثوق)" : "📩 إرسال للمراجعة";
  }
  $("submit").disabled = busy || Object.keys(e).length > 0;
  saveDraft();
}

function insertSep(sep) {
  const ta = $("content");
  const start = ta.selectionStart, end = ta.selectionEnd;
  const insertText = `\n\n${sep}\n\n`;
  ta.value = ta.value.slice(0, start) + insertText + ta.value.slice(end);
  ta.focus();
  render();
}

function formatParagraphs() {
  const ta = $("content");
  ta.value = ta.value.split(/\n+/).map(l => l.trim()).filter(Boolean).join("\n\n");
  render();
}

function saveDraft() {
  if (mode === "edit") return;
  try {
    localStorage.setItem("sm_writer_draft", JSON.stringify({
      titleAr: $("title-ar").value, titleEn: $("title-en").value,
      synopsis: $("synopsis").value, chTitle: $("chapter-title").value,
      content: $("content").value, genres: [...picked]
    }));
  } catch (_) {}
}

function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem("sm_writer_draft") || "null");
    if (!d) return;
    if (d.titleAr) $("title-ar").value = d.titleAr;
    if (d.titleEn) $("title-en").value = d.titleEn;
    if (d.synopsis) $("synopsis").value = d.synopsis;
    if (d.chTitle) $("chapter-title").value = d.chTitle;
    if (d.content) $("content").value = d.content;
    if (Array.isArray(d.genres)) d.genres.forEach(g => picked.add(g));
  } catch (_) {}
}

function clearDraft() {
  $("content").value = "";
  $("chapter-title").value = "";
  try { localStorage.removeItem("sm_writer_draft"); } catch (_) {}
  render();
}

["title-ar", "title-en", "synopsis", "chapter-title", "content", "novel-id", "novel-status", "chapter-num"].forEach(id => {
  $(id).addEventListener("input", render);
});

$("novel-id").addEventListener("change", () => {
  if (mode === "edit") populateEditFields();
  render();
});

$("cover").addEventListener("change", ev => {
  const f = ev.target.files[0]; coverFile = null;
  if (!f) return render();
  if (!RULES.coverTypes.includes(f.type)) {
    $("cover-msg").textContent = "❌ الصيغة غير مدعومة"; $("cover-msg").className = "bad"; return render();
  }
  if (f.size > RULES.coverMax) {
    $("cover-msg").textContent = "❌ الحجم أكبر من 3MB"; $("cover-msg").className = "bad"; return render();
  }
  coverFile = f;
  $("cover-msg").textContent = "✅ " + f.name; $("cover-msg").className = "good";
  $("cover-preview").innerHTML = "";
  $("cover-preview").style.backgroundImage = `url(${URL.createObjectURL(f)})`;
  render();
});

function buildGenres(list) {
  const merged = [...new Set([...list, ...picked])];
  allGenresList = merged;
  $("genres").innerHTML = merged.map(g =>
    `<button type="button" class="chip ${picked.has(g) ? 'on' : ''}" data-g="${esc(g)}">${esc(g)}</button>`
  ).join("");
  $("genres").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const g = b.dataset.g;
    if (picked.has(g)) picked.delete(g);
    else if (picked.size < RULES.maxGenres) picked.add(g);
    b.classList.toggle("on", picked.has(g));
    render();
  });
}

$("add-genre-btn").onclick = () => {
  const val = $("custom-genre-inp").value.trim().replace(/[|•,،]/g, "");
  if (val.length < 2) return;
  if (picked.size >= RULES.maxGenres && !picked.has(val)) {
    tg.showAlert(`الحد الأقصى هو ${RULES.maxGenres} تصنيفات.`);
    return;
  }
  picked.add(val);
  $("custom-genre-inp").value = "";
  buildGenres(allGenresList);
  render();
};

function populateEditFields() {
  const nid = +$("novel-id").value;
  const n = myNovelsList.find(x => Number(x.id) === nid);
  if (!n) return;
  $("title-ar").value = n.title || "";
  $("title-en").value = n.alt_titles || "";
  $("synopsis").value = n.description || "";
  $("novel-status").value = (n.status && n.status.includes("مكتمل")) ? "مكتمل" : ((n.status && n.status.includes("متوقف")) ? "متوقف" : "مستمر");
  if (n.image_url) {
    $("cover-preview").innerHTML = "";
    $("cover-preview").style.backgroundImage = `url(${n.image_url})`;
  }
  picked.clear();
  (n.genre || "").split(/[|•,،]/).map(s => s.trim()).filter(Boolean).forEach(g => {
    if (g !== "كتّاب المجتمع" && g !== "رواية مؤلفة") picked.add(g);
  });
  buildGenres(allGenresList);
}

function setMode(m) {
  mode = m;
  $("tab-novel").classList.toggle("on", m === "novel");
  $("tab-chapter").classList.toggle("on", m === "chapter");
  $("tab-edit").classList.toggle("on", m === "edit");

  $("select-novel-box").classList.toggle("hidden", m === "novel");
  $("novel-part").classList.toggle("hidden", m === "chapter");
  $("chapter-editor-part").classList.toggle("hidden", m === "edit");
  $("status-edit-wrap").classList.toggle("hidden", m !== "edit");
  $("chap-num-wrap").classList.toggle("hidden", m !== "chapter");
  $("chap-title-col").style.gridColumn = m === "chapter" ? "span 1" : "span 2";
  $("cover-opt-lbl").textContent = m === "edit" ? "(اختياري — اتركه للاحتفاظ بالغلاف الحالي)" : "(إجباري)";
  $("ch-label").textContent = m === "novel" ? "عنوان الفصل الأول" : "عنوان الفصل الجديد";

  if (m === "edit") populateEditFields();
  render();
}

$("tab-novel").onclick = () => setMode("novel");
$("tab-chapter").onclick = () => setMode("chapter");
$("tab-edit").onclick = () => setMode("edit");

async function loadMine() {
  loadDraft();
  const defaultGenres = ["أكشن","فانتازيا","رومانسي","غموض","نظام","إيسيكاي","تاريخي","رعب","كوميديا","دراما","فنون قتالية","موريم","شريحة من الحياة","نفسي","خيال علمي"];
  buildGenres(defaultGenres);

  // ⚡ إظهار الرتبة المحفوظة فوراً في 0 ثانية لمنع أي وميض
  const cachedBadge = localStorage.getItem("sm_writer_badge");
  const cachedTrusted = localStorage.getItem("sm_writer_trusted") === "1";
  if (cachedBadge) {
    isTrusted = cachedTrusted;
    $("trust-badge").textContent = cachedBadge;
    $("trust-badge").classList.toggle("trusted", cachedTrusted);
    $("trust-badge").classList.remove("hidden");
  }

  try {
    const uid = tg.initDataUnsafe?.user?.id || "";
    const r = await fetch(`${API}/api/my-novels?uid=${uid}`, { headers: headers() });
    const d = await r.json();
    if (!d.success) return render();
    slotsLeft = d.slots_left;
    isTrusted = !!d.is_trusted;

    let badgeText = "⏳ كاتب صاعد";
    let badgeGreen = false;
    if (isTrusted) {
      badgeText = "👑 كاتب موثوق (نشر فوري)";
      badgeGreen = true;
    } else if (d.novels && d.novels.length > 0) {
      badgeText = "✍️ مؤلف معتمد (" + d.novels.length + " رواية)";
      badgeGreen = true;
    }

    $("trust-badge").textContent = badgeText;
    $("trust-badge").classList.toggle("trusted", badgeGreen);
    $("trust-badge").classList.remove("hidden");

    // حفظ الرتبة في الذاكرة لتظهر في 0 ثانية في المرات القادمة
    try {
      localStorage.setItem("sm_writer_badge", badgeText);
      localStorage.setItem("sm_writer_trusted", badgeGreen ? "1" : "0");
    } catch (_) {}

    buildGenres(d.genres && d.genres.length ? d.genres : defaultGenres);
    myNovelsList = d.novels || [];
    $("novel-id").innerHTML = myNovelsList.map(n => `<option value="${n.id}">${esc(n.title)}${n.alt_titles ? ' | ' + esc(n.alt_titles) : ''}</option>`).join("");
    $("tab-chapter").disabled = myNovelsList.length === 0;
    $("tab-edit").disabled = myNovelsList.length === 0;
  } catch (_) {}
  render();
}

$("submit").onclick = async () => {
  if (Object.keys(validate()).length) return;
  busy = true; render(); $("submit").textContent = "⏳ جارٍ الحفظ والإرسال…";

  try {
    let res;
    const uid = tg.initDataUnsafe?.user?.id || "";
    const uname = tg.initDataUnsafe?.user?.first_name || "مؤلف";
    const titleAr = $("title-ar").value.trim();
    const titleEn = $("title-en").value.trim();
    const mainTitle = titleAr || titleEn;
    const altTitle = (titleAr && titleEn) ? titleEn : "";

    if (mode === "novel") {
      const fd = new FormData();
      fd.append("user_id", uid);
      fd.append("user_name", uname);
      fd.append("title", mainTitle);
      fd.append("title_ar", titleAr);
      fd.append("title_en", titleEn);
      fd.append("alt_titles", altTitle);
      fd.append("synopsis", $("synopsis").value.trim());
      fd.append("genre", [...picked].join(" • "));
      fd.append("cover", coverFile);
      fd.append("chapter_title", $("chapter-title").value.trim());
      fd.append("content", $("content").value.trim());
      res = await fetch(`${API}/api/novels`, { method: "POST", headers: headers(), body: fd });
    } else if (mode === "chapter") {
      res = await fetch(`${API}/api/chapters`, {
        method: "POST",
        headers: { ...headers(), "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: uid,
          user_name: uname,
          manga_id: +$("novel-id").value,
          chapter_number: $("chapter-num").value.trim(),
          chapter_title: $("chapter-title").value.trim(),
          content: $("content").value.trim()
        })
      });
    } else if (mode === "edit") {
      const fd = new FormData();
      fd.append("user_id", uid);
      fd.append("manga_id", $("novel-id").value);
      fd.append("title", mainTitle);
      fd.append("alt_titles", altTitle);
      fd.append("status", $("novel-status").value);
      fd.append("synopsis", $("synopsis").value.trim());
      fd.append("genre", [...picked].join(" • "));
      if (coverFile) fd.append("cover", coverFile);
      res = await fetch(`${API}/api/novels/edit`, { method: "POST", headers: headers(), body: fd });
    }

    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.success) throw new Error(d.error || "حدث خطأ، حاول مرة أخرى");
    try { tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
    if (mode !== "edit") {
      try { localStorage.removeItem("sm_writer_draft"); } catch (_) {}
    }
    const msg = mode === "edit"
      ? "تم تحديث بيانات روايتك وتصنيفاتها بنجاح ✅"
      : (d.auto ? "🎉 لأنك كاتب موثوق، تم نشر عملك مباشرة في التطبيق والبوت ✅" : "تم الإرسال للمراجعة بنجاح، سنبلغك في البوت فور القبول ✅");
    tg.showAlert(msg, () => history.back());
  } catch (err) {
    try { tg.HapticFeedback.notificationOccurred("error"); } catch (_) {}
    tg.showAlert(err.message);
    busy = false; render();
  }
};

loadMine(); render();
</script>
</body>
</html>
