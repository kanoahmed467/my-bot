<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Manga App</title>
    
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات الأيقونات والسحب -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    
    <!-- مكتبة تليجرام وتيلويند -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-base: #0a0c10;
            --primary: #3b82f6;
        }
        body {
            background-color: var(--bg-base);
            color: white;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(17, 20, 27, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .hero-gradient { background: linear-gradient(0deg, var(--bg-base) 0%, rgba(10,12,16,0.6) 50%, transparent 100%); }

        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* إعدادات السلايدر فقط */
        .swiper-wrapper { direction: rtl; }
        .swiper-slide { width: 130px !important; transition: transform 0.2s ease; }
        @media (min-width: 768px) { .swiper-slide { width: 170px !important; } }
        
        /* إعدادات الكروت العامة */
        .manga-card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            z-index: 10;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
    </style>
</head>
<body class="flex pb-20 md:pb-0">

    <!-- شاشة التحميل -->
    <div id="splash-screen" class="fixed inset-0 z-[9999] bg-[#0a0c10] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="w-10 h-10 border-4 border-blue-500/30 border-t-blue-500 rounded-full animate-spin mb-4"></div>
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-blue-600">
            Speed Manga
        </h1>
    </div>

    <!-- القائمة الجانبية (للكمبيوتر) -->
    <aside class="hidden md:flex flex-col w-64 h-screen fixed right-0 top-0 bg-[#0d1017] border-l border-white/5 z-40 p-6">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-xl font-bold shadow-lg">S</div>
            <h1 class="text-2xl font-black tracking-wide">سبيد مانجا</h1>
        </div>

        <nav class="flex-1 space-y-2">
            <a href="#" onclick="closeAllModals()" class="flex items-center gap-4 px-4 py-3 rounded-xl bg-blue-600/10 text-blue-400 font-bold transition">
                <i class="fa-solid fa-house text-lg w-5"></i> الرئيسية
            </a>
            <a href="#" onclick="openSearch()" class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white transition font-semibold">
                <i class="fa-solid fa-magnifying-glass text-lg w-5"></i> بحث
            </a>
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mt-8 mb-4 px-4">الأقسام</h3>
            <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white transition font-semibold">
                <span class="text-lg w-5">🇰🇷</span> مانهوا كورية
            </a>
            <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white transition font-semibold">
                <span class="text-lg w-5">🇯🇵</span> مانجا يابانية
            </a>
            <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white transition font-semibold">
                <i class="fa-solid fa-bookmark text-lg w-5"></i> قائمتي
            </a>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/5">
            <div onclick="openProfile()" class="flex items-center gap-3 p-2 rounded-xl hover:bg-white/5 cursor-pointer transition">
                <div class="w-10 h-10 rounded-full bg-slate-700 overflow-hidden">
                    <img id="side-user-avatar" src="https://ui-avatars.com/api/?name=Guest&background=random" class="w-full h-full object-cover">
                </div>
                <div>
                    <h4 id="side-user-name" class="text-sm font-bold">ضيف</h4>
                    <p class="text-xs text-gray-400">الإعدادات</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="w-full md:pr-64 min-h-screen relative">
        
        <!-- البانر الرئيسي -->
        <div id="hero-section" class="relative w-full h-[50vh] md:h-[65vh] bg-slate-900 hidden">
            <img id="hero-img" src="" class="absolute inset-0 w-full h-full object-cover opacity-60" alt="Hero">
            <div class="absolute inset-0 hero-gradient"></div>
            
            <div class="absolute inset-0 flex flex-col justify-end p-5 md:p-10 z-10 fade-in-up">
                <div class="flex items-center gap-2 mb-2">
                    <span id="hero-origin" class="bg-white/10 px-2 py-0.5 rounded text-xs font-bold border border-white/10"></span>
                    <span id="hero-genre" class="text-blue-400 font-bold text-sm tracking-wide drop-shadow-md"></span>
                </div>
                <h1 id="hero-title" class="text-3xl md:text-5xl font-black mb-3 text-white drop-shadow-lg line-clamp-2 md:line-clamp-none"></h1>
                <p id="hero-desc" class="text-gray-300 text-sm md:text-base line-clamp-2 mb-5 max-w-2xl"></p>
                
                <div class="flex gap-3">
                    <button onclick="playHero()" class="bg-white text-black px-6 py-2.5 rounded-md font-bold flex items-center gap-2 hover:bg-gray-200 transition">
                        <i class="fa-solid fa-play"></i> قراءة الآن
                    </button>
                    <button class="bg-gray-800/80 text-white px-5 py-2.5 rounded-md font-bold flex items-center gap-2 hover:bg-gray-700 transition">
                        <i class="fa-solid fa-plus"></i> قائمتي
                    </button>
                </div>
            </div>
        </div>

        <!-- القوائم الأفقية -->
        <div id="main-content" class="px-4 md:px-8 mt-6 relative z-20 hidden space-y-10 pb-10">
            <!-- أحدث الأعمال -->
            <div class="fade-in-up" style="animation-delay: 0.1s;">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 border-r-4 border-blue-500 pr-2">أحدث الأعمال</h2>
                <div class="swiper mySwiper overflow-visible">
                    <div class="swiper-wrapper" id="latest-mangas"></div>
                </div>
            </div>

            <!-- مانهوا كورية -->
            <div class="fade-in-up" style="animation-delay: 0.2s;">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 border-r-4 border-purple-500 pr-2">مانهوا ونظام</h2>
                <div class="swiper mySwiper overflow-visible">
                    <div class="swiper-wrapper" id="korean-mangas"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- شريط التنقل السفلي للموبايل -->
    <nav class="fixed bottom-0 w-full glass-panel border-t-0 flex justify-around items-center p-3 pb-safe z-50 md:hidden shadow-lg">
        <a href="#" onclick="closeAllModals()" class="flex flex-col items-center text-blue-500">
            <i class="fa-solid fa-house text-lg mb-1"></i>
            <span class="text-[10px] font-bold">الرئيسية</span>
        </a>
        <a href="#" onclick="openSearch()" class="flex flex-col items-center text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-magnifying-glass text-lg mb-1"></i>
            <span class="text-[10px] font-bold">بحث</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-bookmark text-lg mb-1"></i>
            <span class="text-[10px] font-bold">قائمتي</span>
        </a>
        <a href="#" onclick="openProfile()" class="flex flex-col items-center text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-user text-lg mb-1"></i>
            <span class="text-[10px] font-bold">حسابي</span>
        </a>
    </nav>

    <!-- ========================================= -->
    <!-- شاشة البحث المنبثقة (محدثة ومضادة للاج) -->
    <!-- ========================================= -->
    <div id="search-modal" class="fixed inset-0 z-[100] bg-[#0a0c10] hidden flex-col transition-opacity duration-300 opacity-0">
        <!-- هيدر البحث -->
        <div class="p-4 md:p-6 flex items-center gap-3 bg-[#0d1017] border-b border-white/5">
            <button onclick="closeAllModals()" class="text-gray-400 hover:text-white p-2">
                <i class="fa-solid fa-arrow-right text-xl"></i>
            </button>
            <div class="flex-1 relative max-w-2xl mx-auto">
                <i class="fa-solid fa-search absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="ابحث عن عمل..." autocomplete="off"
                       class="w-full bg-[#1c212c] text-white rounded-lg py-3 pr-12 pl-4 focus:outline-none focus:ring-1 focus:ring-blue-500 border border-white/5 font-semibold placeholder-gray-500">
            </div>
        </div>
        <!-- نتائج البحث (Grid سليم) -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <div id="search-results" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6 max-w-7xl mx-auto">
                <div class="col-span-full flex flex-col items-center justify-center h-[50vh] text-gray-600">
                    <i class="fa-solid fa-book-open text-4xl mb-3 opacity-50"></i>
                    <p>اكتب اسم العمل للبحث...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- شاشة الحساب -->
    <!-- ========================================= -->
    <div id="profile-modal" class="fixed inset-0 z-[100] bg-[#0a0c10] hidden flex-col transition-transform transform translate-y-full duration-300">
        <div class="p-4 flex items-center justify-between border-b border-white/5 bg-[#0d1017]">
            <h2 class="text-lg font-bold">حسابي</h2>
            <button onclick="closeAllModals()" class="text-gray-400 hover:text-white p-2">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 md:p-8 max-w-2xl mx-auto w-full">
            <div class="bg-slate-800/50 rounded-xl p-6 border border-white/5 mb-6 text-center">
                <img id="prof-avatar" src="" class="w-20 h-20 rounded-full mx-auto mb-3 object-cover border-2 border-slate-600">
                <h2 id="prof-name" class="text-xl font-bold mb-1">...</h2>
                <span class="inline-block bg-slate-700 text-gray-300 px-3 py-1 rounded-full text-xs font-bold">عضو</span>
            </div>

            <div class="space-y-3">
                <button class="w-full bg-[#11141b] flex items-center justify-between p-4 rounded-lg hover:bg-slate-800 transition border border-white/5">
                    <div class="flex items-center gap-4 text-blue-400"><i class="fa-solid fa-clock-rotate-left"></i> <span class="font-semibold text-white">سجل القراءة</span></div>
                </button>
                <button class="w-full bg-[#11141b] flex items-center justify-between p-4 rounded-lg hover:bg-slate-800 transition border border-white/5">
                    <div class="flex items-center gap-4 text-gray-400"><i class="fa-solid fa-gear"></i> <span class="font-semibold text-white">الإعدادات</span></div>
                </button>
            </div>
        </div>
    </div>

    <!-- السكربتات -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0d1017');
        tg.setBackgroundColor('#0a0c10');

        let allMangasData = []; 
        let heroMangaId = null;

        // تهيئة بيانات المستخدم
        const user = tg.initDataUnsafe?.user;
        const userName = user ? user.first_name : "ضيف";
        const userAvatar = user && user.photo_url ? user.photo_url : `https://ui-avatars.com/api/?name=${userName}&background=3b82f6&color=fff&bold=true`;
        
        document.getElementById('side-user-name').innerText = userName;
        document.getElementById('side-user-avatar').src = userAvatar;
        document.getElementById('prof-name').innerText = userName;
        document.getElementById('prof-avatar').src = userAvatar;

        // ==========================================
        // 🛠️ دوال إنشاء الكروت (لحل مشكلة التداخل)
        // ==========================================
        
        // 1. كارت السلايدر الأفقي (يحتوي على swiper-slide)
        const createCarouselCard = (manga) => {
            const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(manga.title)}&background=1f2937&color=3b82f6&size=300&font-size=0.1`;
            return `
                <div class="swiper-slide cursor-pointer" onclick="openMangaDetails(${manga.id})">
                    <div class="relative w-full aspect-[2/3] rounded-lg overflow-hidden mb-2 manga-card-hover bg-slate-800">
                        <img src="${manga.image_url}" class="absolute inset-0 w-full h-full object-cover" alt="${manga.title}" onerror="this.onerror=null;this.src='${fallbackImg}';">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                        <div class="absolute top-1 right-1 bg-black/60 px-1.5 py-0.5 rounded text-[10px] font-bold text-yellow-400">
                            ★ ${manga.rating || 'N/A'}
                        </div>
                    </div>
                    <h3 class="text-xs font-bold text-white line-clamp-1">${manga.title}</h3>
                </div>
            `;
        };

        // 2. كارت شبكة البحث (Grid Card - بدون swiper-slide لحل المشكلة)
        const createGridCard = (manga) => {
            const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(manga.title)}&background=1f2937&color=3b82f6&size=300&font-size=0.1`;
            return `
                <div class="relative w-full aspect-[2/3] rounded-lg overflow-hidden cursor-pointer manga-card-hover bg-slate-800 border border-white/5" onclick="openMangaDetails(${manga.id})">
                    <img src="${manga.image_url}" class="absolute inset-0 w-full h-full object-cover" alt="${manga.title}" onerror="this.onerror=null;this.src='${fallbackImg}';">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0a0c10] via-transparent to-transparent opacity-90"></div>
                    <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-sm px-1.5 py-0.5 rounded text-[10px] font-bold text-yellow-400">
                        ★ ${manga.rating || 'N/A'}
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-2.5">
                        <h3 class="text-xs sm:text-sm font-bold text-white line-clamp-2 leading-tight">${manga.title}</h3>
                    </div>
                </div>
            `;
        };

        const dataUrl = 'https://raw.githubusercontent.com/kanoahmed467/my-bot/main/data.json';

        async function loadApp() {
            try {
                const response = await fetch(`${dataUrl}?t=${new Date().getTime()}`);
                const data = await response.json();
                allMangasData = data.mangas;

                if (allMangasData.length > 0) {
                    const hero = allMangasData[0];
                    heroMangaId = hero.id;
                    document.getElementById('hero-img').src = hero.image_url;
                    document.getElementById('hero-img').onerror = function() { this.src='https://via.placeholder.com/800x600?text=No+Cover'; };
                    document.getElementById('hero-title').innerText = hero.title;
                    document.getElementById('hero-desc').innerText = hero.description || "";
                    document.getElementById('hero-genre').innerText = (hero.genre || "أكشن").split('•')[0].trim();
                    document.getElementById('hero-origin').innerText = hero.origin || 'مانهوا';
                    
                    document.getElementById('hero-section').classList.remove('hidden');

                    const latestBox = document.getElementById('latest-mangas');
                    allMangasData.slice(1, 12).forEach(m => latestBox.innerHTML += createCarouselCard(m));

                    const krBox = document.getElementById('korean-mangas');
                    allMangasData.filter(m => m.origin === 'مانهوا').slice(0, 10).forEach(m => krBox.innerHTML += createCarouselCard(m));

                    new Swiper(".mySwiper", {
                        slidesPerView: "auto", spaceBetween: 12, freeMode: true, grabCursor: true, rtl: true
                    });

                    document.getElementById('main-content').classList.remove('hidden');
                    document.getElementById('splash-screen').style.opacity = '0';
                    setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 300);
                }
            } catch (error) {
                document.getElementById('splash-screen').innerHTML = `<p class="text-red-500 font-bold">حدث خطأ في الاتصال بالسيرفر.</p>`;
            }
        }

        // ================== Modals ==================
        function openSearch() {
            const modal = document.getElementById('search-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('search-input').focus();
            }, 10);
        }

        function openProfile() {
            const modal = document.getElementById('profile-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('translate-y-full'), 10);
        }

        function closeAllModals() {
            const searchModal = document.getElementById('search-modal');
            const profileModal = document.getElementById('profile-modal');
            
            searchModal.classList.add('opacity-0');
            profileModal.classList.add('translate-y-full');
            
            setTimeout(() => {
                searchModal.classList.add('hidden');
                profileModal.classList.add('hidden');
            }, 300);
        }

        // ==========================================
        // 🚀 نظام منع اللاج في البحث (Debounce)
        // ==========================================
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => { clearTimeout(timeout); func(...args); };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        const handleSearch = debounce((e) => {
            const query = e.target.value.toLowerCase().trim();
            const resultsBox = document.getElementById('search-results');
            
            if(query.length < 2) {
                resultsBox.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center h-[50vh] text-gray-600">
                        <i class="fa-solid fa-book-open text-4xl mb-3 opacity-50"></i>
                        <p>اكتب اسم العمل للبحث...</p>
                    </div>`;
                return;
            }

            const results = allMangasData.filter(m => 
                m.title.toLowerCase().includes(query) || 
                (m.alt_titles && m.alt_titles.toLowerCase().includes(query))
            );

            if(results.length === 0) {
                resultsBox.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10">لم أجد عملاً بهذا الاسم.</div>`;
                return;
            }

            resultsBox.innerHTML = '';
            // استخدام الكارت الخاص بالشبكة لحل مشكلة تداخل الأسماء
            results.forEach(m => {
                resultsBox.innerHTML += createGridCard(m);
            });
        }, 300); // يستنى 300 جزء من الثانية بعد ما تبطل كتابة عشان يبحث

        document.getElementById('search-input').addEventListener('input', handleSearch);

        function openMangaDetails(id) {
            tg.HapticFeedback.impactOccurred('light');
            tg.showAlert(`قريباً: صفحة التفاصيل للعمل رقم ${id}`);
        }
        function playHero() {
            if(heroMangaId) openMangaDetails(heroMangaId);
        }

        loadApp();
    </script>
</body>
</html>
