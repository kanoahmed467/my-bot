<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Manga - Kingdom</title>
    <!-- خط Cairo لجعله احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- مكتبة تليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- مكتبة Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #0b0f19; /* لون كحلي غامق جداً وفخم */
            --card-bg: #151c2c;
            --accent: #3b82f6;
        }
        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* تدرج لوني للخلفية */
        .body-gradient {
            background: linear-gradient(180deg, #0f172a 0%, #0b0f19 100%);
            min-height: 100vh;
        }
        /* تدرج لوني فوق الصور */
        .card-overlay {
            background: linear-gradient(to top, rgba(11, 15, 25, 0.95) 0%, rgba(11, 15, 25, 0.4) 50%, transparent 100%);
        }
        /* تأثير الزجاج */
        .glass-badge {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="body-gradient pb-10">

    <!-- شريط علوي (Navbar) -->
    <div class="sticky top-0 z-50 bg-[#0f172a]/80 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <span class="text-2xl">👑</span>
            <h1 class="text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-l from-blue-400 to-purple-500">
                المملكة
            </h1>
        </div>
        <div id="userInfo" class="text-sm font-semibold bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
            ⏳ تحميل...
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="p-4 max-w-7xl mx-auto">
        <h2 class="text-lg font-bold mb-5 flex items-center gap-2 text-gray-100">
            <span class="text-red-500">🔥</span> أحدث الأعمال المُضافة
        </h2>
        
        <!-- Grid متجاوب (2 عالموبايل، 3 تابلت، 4/5 شاشات كبيرة) -->
        <div id="manga-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-5">
            <!-- سيتم إضافة المانجات هنا -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f172a'); // تغيير لون شريط تليجرام من فوق
        
        // عرض بيانات المستخدم
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userInfo').innerHTML = `👤 ${user.first_name}`;
        } else {
            document.getElementById('userInfo').innerHTML = `👤 ضيف المملكة`;
        }

        const dataUrl = 'https://raw.githubusercontent.com/kanoahmed467/my-bot/main/data.json';

        // دالة إنشاء هيكل التحميل (Skeleton Loader)
        function showLoading() {
            const grid = document.getElementById('manga-grid');
            grid.innerHTML = '';
            for(let i=0; i<10; i++) {
                grid.innerHTML += `
                    <div class="animate-pulse rounded-xl bg-slate-800 aspect-[2/3] w-full"></div>
                `;
            }
        }

        async function fetchMangas() {
            showLoading(); // عرض تأثير التحميل أولاً
            try {
                // إضافة timestamp عشان نمنع الـ Cache ويجيب أحدث داتا دايماً
                const response = await fetch(`${dataUrl}?t=${new Date().getTime()}`);
                const data = await response.json();
                const grid = document.getElementById('manga-grid');
                grid.innerHTML = ''; 

                data.mangas.forEach(manga => {
                    // إنشاء الكارت
                    const card = document.createElement('div');
                    // كلاسات الأنميشن والتصميم
                    card.className = 'group relative rounded-xl overflow-hidden cursor-pointer shadow-lg aspect-[2/3] w-full bg-slate-800 ring-1 ring-slate-700/50 transition-all duration-300 hover:ring-blue-500/50 hover:shadow-blue-500/20 hover:-translate-y-1';
                    
                    card.onclick = () => {
                        // هنا لاحقاً هنضيف كود الإعلان قبل ما نفتح التفاصيل
                        tg.HapticFeedback.impactOccurred('light'); // هزاز الموبايل
                        tg.showAlert(`قريباً: فتح تفاصيل ${manga.title} ودمج الإعلانات!`);
                    };

                    // استخراج أول تصنيف فقط لعدم الزحمة
                    const firstGenre = manga.genre ? manga.genre.split('•')[0].trim() : 'أكشن';

                    card.innerHTML = `
                        <!-- الصورة -->
                        <img src="${manga.image_url}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" alt="${manga.title}" onerror="this.src='https://via.placeholder.com/400x600?text=بدون+غلاف'">
                        
                        <!-- التدرج اللوني فوق الصورة -->
                        <div class="absolute inset-0 card-overlay transition-opacity duration-300"></div>
                        
                        <!-- الشارات (تقييم + حالة) -->
                        <div class="absolute top-2 left-2 right-2 flex justify-between items-start">
                            <div class="glass-badge text-yellow-400 text-[11px] sm:text-xs font-bold px-2 py-1 rounded-md flex items-center gap-1">
                                ⭐ ${manga.rating}
                            </div>
                            ${manga.origin === 'مانهوا' ? '<div class="glass-badge text-xs px-1.5 py-0.5 rounded-md">🇰🇷</div>' : ''}
                            ${manga.origin === 'مانجا' ? '<div class="glass-badge text-xs px-1.5 py-0.5 rounded-md">🇯🇵</div>' : ''}
                            ${manga.origin === 'مانها' ? '<div class="glass-badge text-xs px-1.5 py-0.5 rounded-md">🇨🇳</div>' : ''}
                        </div>

                        <!-- النصوص (العنوان والتصنيف) -->
                        <div class="absolute bottom-0 left-0 right-0 p-3 transform transition-transform duration-300">
                            <span class="inline-block px-2 py-0.5 mb-1.5 text-[10px] sm:text-xs font-bold text-blue-100 bg-blue-600/80 rounded-full">
                                ${firstGenre}
                            </span>
                            <h3 class="font-extrabold text-sm sm:text-base text-white leading-tight line-clamp-2 drop-shadow-md">
                                ${manga.title}
                            </h3>
                            <div class="flex items-center gap-2 mt-1.5 text-[11px] sm:text-xs text-gray-300">
                                <span class="flex items-center gap-1 ${manga.status.includes('مستمر') ? 'text-green-400' : 'text-gray-400'}">
                                    <span class="w-1.5 h-1.5 rounded-full ${manga.status.includes('مستمر') ? 'bg-green-400' : 'bg-gray-400'} inline-block"></span>
                                    ${manga.status}
                                </span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('manga-grid').innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-10 text-gray-400">
                        <span class="text-4xl mb-3">📡</span>
                        <p>عذراً، حدث خطأ أثناء الاتصال بالمملكة.</p>
                    </div>`;
            }
        }

        fetchMangas();
    </script>
</body>
</html>
