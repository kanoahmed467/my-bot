<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Manga - Kingdom</title>
    <!-- مكتبة تليجرام لربط التطبيق بالبوت -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- مكتبة Tailwind CSS للتصميم السريع والفخم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-bg { background-color: var(--tg-theme-secondary-bg-color, #1e293b); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- شريط علوي -->
    <div class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-700 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-400">👑 المملكة - Speed Manga</h1>
        <div id="userInfo" class="text-sm font-semibold text-gray-300">جاري التحميل...</div>
    </div>

    <!-- قسم الأعمال -->
    <div class="p-4">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2">🔥 أحدث الأعمال</h2>
        
        <div id="manga-grid" class="grid grid-cols-2 gap-4">
            <!-- سيتم إضافة المانجات هنا تلقائياً عبر جافاسكربت -->
        </div>
    </div>

    <script>
        // 1. تهيئة تطبيق تليجرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // جعل التطبيق يملأ الشاشة
        
        // جلب اسم المستخدم من تليجرام
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userInfo').innerHTML = `👤 ${user.first_name}`;
        } else {
            document.getElementById('userInfo').innerHTML = `👤 ضيف`;
        }

        // 2. جلب البيانات من ملف البوت على جيت هاب
        // لاحظ: استخدمنا الرابط الخاص بك بناءً على الكود اللي ارسلته
        const dataUrl = 'https://raw.githubusercontent.com/kanoahmed467/my-bot/main/data.json';

        async function fetchMangas() {
            try {
                const response = await fetch(dataUrl);
                const data = await response.json();
                const grid = document.getElementById('manga-grid');
                grid.innerHTML = ''; // تفريغ التحميل

                // 3. عرض المانجات
                data.mangas.forEach(manga => {
                    const card = document.createElement('div');
                    card.className = 'card-bg rounded-xl overflow-hidden shadow-lg relative cursor-pointer active:scale-95 transition-transform';
                    
                    // عند الضغط على المانجا (هنا هنبرمجها تفتح التفاصيل بعدين)
                    card.onclick = () => {
                        tg.showAlert(`قريباً: فتح تفاصيل ${manga.title} لقراءتها!`);
                        // يمكنك هنا جعل الزر يرسل رسالة للبوت ليفتح المانجا
                        // tg.sendData(`OPEN_MANGA_${manga.id}`);
                    };

                    card.innerHTML = `
                        <div class="relative h-48 w-full">
                            <img src="${manga.image_url}" class="w-full h-full object-cover" alt="${manga.title}" onerror="this.src='https://via.placeholder.com/300x400?text=No+Cover'">
                            <div class="absolute top-2 left-2 bg-black/70 px-2 py-1 rounded text-xs font-bold text-yellow-400">
                                ⭐ ${manga.rating}
                            </div>
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-sm truncate">${manga.title}</h3>
                            <p class="text-xs text-gray-400 mt-1">${manga.genre.split('•')[0]} • ${manga.status}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('manga-grid').innerHTML = `<p class="text-red-400 col-span-2 text-center">عذراً، جاري تحديث المكتبة أو يوجد خطأ في الاتصال.</p>`;
                console.error("Error fetching data:", error);
            }
        }

        // تشغيل الدالة فور فتح التطبيق
        fetchMangas();
    </script>
</body>
</html>
