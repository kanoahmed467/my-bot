<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Manga - Mini App</title>
    
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات الأيقونات والسحب (Swiper) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    
    <!-- مكتبة تليجرام وتيلويند -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --tg-bg: #0f1115; /* لون خلفية مظلم جداً وفخم */
            --primary: #3b82f6;
        }
        body {
            background-color: var(--tg-bg);
            color: white;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* تدرج البانر الرئيسي */
        .hero-gradient {
            background: linear-gradient(0deg, #0f1115 0%, rgba(15,17,21,0.7) 40%, rgba(15,17,21,0.1) 100%);
        }

        /* إخفاء شريط التمرير للسلايدرات مع الحفاظ على السحب */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* شاشة التحميل الأولية */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            background-color: #0f1115;
            display: flex; justify-content: center; items-center; flex-direction: column;
            transition: opacity 0.5s ease;
        }
        .loader {
            width: 50px; height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* تعديلات السلايدر (Swiper) */
        .swiper-slide {
            width: 140px !important; /* عرض الكارت في الموبايل */
            transition: transform 0.3s ease;
        }
        @media (min-width: 768px) {
            .swiper-slide { width: 180px !important; } /* عرض الكارت في التابلت واللاب */
        }
        .swiper-slide:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="pb-20"> <!-- pb-20 عشان القائمة السفلية متغطيش على المحتوى -->

    <!-- شاشة التحميل -->
    <div id="splash-screen" class="flex items-center justify-center h-screen">
        <div class="loader mb-4"></div>
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 tracking-wider">
            SPEED MANGA
        </h1>
    </div>

    <!-- البانر الرئيسي (Hero Section) - سيتم تعبئته بالجافاسكربت -->
    <div id="hero-section" class="relative w-full h-[60vh] md:h-[75vh] bg-gray-900 hidden">
        <!-- الصورة الخلفية -->
        <img id="hero-img" src="" class="absolute inset-0 w-full h-full object-cover opacity-80" alt="Hero">
        <!-- التدرج اللوني -->
        <div class="absolute inset-0 hero-gradient"></div>
        
        <!-- محتوى البانر -->
        <div class="absolute bottom-0 left-0 right-0 p-6 md:p-12 flex flex-col justify-end h-full">
            <span id="hero-genre" class="text-blue-400 font-bold text-sm tracking-wider mb-2 drop-shadow-lg"></span>
            <h1 id="hero-title" class="text-3xl md:text-5xl font-black mb-3 leading-tight drop-shadow-2xl line-clamp-2 text-white"></h1>
            <p id="hero-desc" class="text-gray-300 text-sm md:text-base line-clamp-2 md:line-clamp-3 mb-6 max-w-2xl drop-shadow-md"></p>
            
            <div class="flex gap-3">
                <button onclick="playHero()" class="bg-white text-black px-6 py-2.5 rounded-md font-bold flex items-center gap-2 hover:bg-gray-200 transition">
                    <i class="fa-solid fa-play"></i> قراءة الآن
                </button>
                <button onclick="tg.showAlert('تمت الإضافة للقائمة!')" class="bg-gray-600/60 backdrop-blur text-white px-6 py-2.5 rounded-md font-bold flex items-center gap-2 hover:bg-gray-600 border border-gray-500/30 transition">
                    <i class="fa-solid fa-plus"></i> قائمتي
                </button>
            </div>
        </div>
    </div>

    <!-- المحتوى (القوائم الأفقية) -->
    <main id="main-content" class="px-4 md:px-12 mt-6 hidden">
        
        <!-- القسم الأول: أحدث الإضافات -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold border-r-4 border-blue-500 pr-2">🔥 أحدث الأعمال</h2>
                <a href="#" class="text-sm text-gray-400 hover:text-white">عرض الكل</a>
            </div>
            
            <!-- Swiper Container -->
            <div class="swiper mySwiper overflow-visible">
                <div class="swiper-wrapper" id="latest-mangas">
                    <!-- الكروت هتتضاف هنا -->
                </div>
            </div>
        </div>

        <!-- القسم الثاني: المانهوا الكورية -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold border-r-4 border-purple-500 pr-2">🇰🇷 مانهوا وتصنيف نظام</h2>
            </div>
            <div class="swiper mySwiper overflow-visible">
                <div class="swiper-wrapper" id="korean-mangas">
                    <!-- الكروت هتتضاف هنا -->
                </div>
            </div>
        </div>

    </main>

    <!-- قائمة سفلية (Navigation Bar) للموبايل -->
    <nav class="fixed bottom-0 w-full bg-[#161920]/95 backdrop-blur border-t border-gray-800 flex justify-around items-center p-3 pb-safe z-50 md:hidden">
        <a href="#" class="flex flex-col items-center text-blue-500">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1 font-bold">الرئيسية</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="text-[10px] mt-1 font-bold">بحث</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-bookmark text-lg"></i>
            <span class="text-[10px] mt-1 font-bold">قائمتي</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] mt-1 font-bold">حسابي</span>
        </a>
    </nav>

    <!-- سكربت Swiper -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f1115');

        // متغير لحفظ الـ ID بتاع المانجا اللي في البانر
        let heroMangaId = null;

        function playHero() {
            if(heroMangaId) {
                // هنا هنربط الإعلان لاحقاً
                tg.showAlert(`سيتم تشغيل المانجا رقم ${heroMangaId}`);
            }
        }

        const dataUrl = 'https://raw.githubusercontent.com/kanoahmed467/my-bot/main/data.json';

        async function loadApp() {
            try {
                const response = await fetch(`${dataUrl}?t=${new Date().getTime()}`);
                const data = await response.json();
                const mangas = data.mangas;

                if (mangas && mangas.length > 0) {
                    // 1. إعداد البانر الرئيسي (ناخد أول مانجا)
                    const hero = mangas[0];
                    heroMangaId = hero.id;
                    document.getElementById('hero-img').src = hero.image_url;
                    document.getElementById('hero-title').innerText = hero.title;
                    document.getElementById('hero-desc').innerText = hero.description || "لا يوجد وصف متاح.";
                    document.getElementById('hero-genre').innerText = (hero.genre || "أكشن").split('•')[0].trim();
                    
                    document.getElementById('hero-section').classList.remove('hidden');

                    // 2. دالة لإنشاء الكروت
                    const createCard = (manga) => {
                        const statusColor = manga.status.includes("مستمر") ? "text-green-400" : "text-gray-400";
                        return `
                            <div class="swiper-slide cursor-pointer group" onclick="tg.showAlert('فتح تفاصيل: ${manga.title}')">
                                <div class="relative w-full aspect-[2/3] rounded-lg overflow-hidden mb-2">
                                    <img src="${manga.image_url}" class="w-full h-full object-cover transition duration-300 group-hover:scale-110" alt="${manga.title}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Cover'">
                                    <div class="absolute top-1 right-1 bg-black/80 px-1.5 py-0.5 rounded text-[10px] font-bold text-yellow-500 backdrop-blur">
                                        ★ ${manga.rating || 'N/A'}
                                    </div>
                                    <div class="absolute bottom-0 left-0 right-0 h-1/2 bg-gradient-to-t from-black/90 to-transparent"></div>
                                </div>
                                <h3 class="text-sm font-bold text-gray-100 line-clamp-1 group-hover:text-blue-400 transition">${manga.title}</h3>
                                <p class="text-[11px] font-semibold ${statusColor} mt-0.5">${manga.status || 'غير محدد'}</p>
                            </div>
                        `;
                    };

                    // 3. تعبئة السلايدر الأول (كل الأعمال)
                    const latestContainer = document.getElementById('latest-mangas');
                    mangas.slice(1, 10).forEach(m => {
                        latestContainer.innerHTML += createCard(m);
                    });

                    // 4. تعبئة السلايدر الثاني (فلترة وهمية للمانهوا أو الأكشن)
                    const koreanContainer = document.getElementById('korean-mangas');
                    mangas.slice(0).reverse().slice(0, 8).forEach(m => {
                        koreanContainer.innerHTML += createCard(m);
                    });

                    // 5. تفعيل Swiper.js للسحب الناعم
                    new Swiper(".mySwiper", {
                        slidesPerView: "auto",
                        spaceBetween: 16,
                        freeMode: true,
                        grabCursor: true,
                    });

                    // إظهار المحتوى وإخفاء شاشة التحميل
                    document.getElementById('main-content').classList.remove('hidden');
                    document.getElementById('splash-screen').style.opacity = '0';
                    setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 500);

                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('splash-screen').innerHTML = `<p class="text-red-500 font-bold text-xl">حدث خطأ في الاتصال بالخادم!</p>`;
            }
        }

        // بدء التشغيل
        loadApp();
    </script>
</body>
</html>
